[workspace]
members = [
    "src/ods-core",
    "src/ods-cli",
    "src/ods-test-support",
]
# Removed from product: ods-lsp, zed-ods-lsp (CLI + service only).
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.0.25"
license = "Apache-2.0"
rust-version = "1.85"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "debuginfo"
