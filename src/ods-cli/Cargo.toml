[package]
name = "ods-cli"
description = "Open Document Spec CLI (ods) — unified ODS engine"
default-run = "ods"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
ods-core = { path = "../ods-core" }
ctrlc = { version = "3", features = ["termination"] }
flate2 = "1"
notify-debouncer-mini = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
toml_edit = "0.22"
ureq = { version = "2.12", default-features = true, features = ["tls"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[[bin]]
name = "ods"
path = "src/main.rs"

[dev-dependencies]
ods-test-support = { path = "../ods-test-support" }
tempfile = "3"

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[[test]]
name = "adopt_test"
path = "tests/adopt.test.rs"

